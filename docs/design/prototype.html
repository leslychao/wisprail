primary" onclick="requestConnect('${p.id}')">Повторить</button>`;sym='alert';}else if(other){description='Можно переключиться с текущего VPN';action=`<button class="btn primary" onclick="requestConnect('${p.id}')">${icon('swap')}Переключиться</button>`;}if(busy&&!(active||target))action='<button class="btn" disabled>Дождитесь завершения</button>';
$('view').innerHTML=`<div class="workspace"><aside class="profiles"><div class="profiles-head"><span>Мои VPN <span class="muted small">${state.profiles.length}</span></span><button class="btn icon ghost" title="Добавить VPN" aria-label="Добавить VPN" onclick="showAdd()">${icon('plus')}</button></div>${state.profiles.length>=7?'<input aria-label="Поиск VPN" placeholder="Найти VPN" oninput="filterProfiles(this.value)" style="margin-bottom:12px">':''}<div class="profile-items">${state.profiles.map(q=>`<button class="profile-item ${q.id===p.id?'selected':''}" data-pid="${q.id}" onclick="selectProfile('${q.id}')" aria-pressed="${q.id===p.id}"><div class="profile-title">${esc(q.name)}</div><div class="profile-sub"><span>${esc(q.type)}</span><span class="sep">·</span><span class="dot ${q.id===state.active&&state.phase==='CONNECTED'?'green':q.id===state.target&&busy?'blue':''}"></span><span>${q.id===state.active&&state.phase==='CONNECTED'?'Подключён':q.id===state.target&&busy?'Подключение…':'Не подключён'}</span></div></button>`).join('')}</div><div class="spacer"></div><p class="profile-note">Одновременно подключён<br>только один профиль.</p></aside><section class="main-detail"><div class="row between"><div><h1>${esc(p.name)}</h1><p class="small muted" style="margin-top:7px">${esc(p.type)} <span class="sep">·</span> <span class="mono">${esc(p.server)}</span></p></div><div class="row gap6"><button class="btn sm" onclick="editProfile('${p.id}')" ${busy?'disabled':''}>Изменить</button><button class="btn icon ghost" aria-label="Действия с профилем" onclick="toggleMenu(event)" ${busy?'disabled':''}>${icon('dots')}</button></div></div>${other?`<div class="notice amber mt">${icon('swap')}<span>Сейчас работает <strong>${esc(activeProfile().name)}</strong>. При переключении он будет отключён.</span></div>`:''}${!state.engineAvailable?`<div class="notice red mt">${icon('alert')}<span>Компонент sing-box недоступен. Подключение пока невозможно.<br><button class="link" onclick="state.settingsTab='components';navigate('settings')">Открыть настройки компонента</button></span></div>`:''}<div class="connection"><div class="row"><span class="status-icon ${color}">${sym==='spinner'?'<span class="spinner"></span>':icon(sym)}</span><div class="grow"><div class="status-title">${title}</div><div class="status-description">${description}</div></div>${action}</div>${busy&&(active||target)?'<div class="busy-line"></div>':''}${active&&state.phase==='CONNECTED'?'<div class="connection-footer"><span>Подключение активно</span><button class="link" onclick="openDiagnostics()">Проверить доступность</button></div>':error?`<div class="connection-footer"><span>${state.error==='cleanup'?'Не считайте настройки сети восстановленными.':'Настройки профиля сохранены.'}</span><button class="link" onclick="openErrorLog()">Открыть журнал</button></div>`:''}</div>${pendingChanges(p.id)?`<div class="notice amber" style="margin-bottom:20px">${icon('info')}<span>Есть сохранённые изменения. Ниже показаны действующие настройки.<br><button class="link" onclick="requestApply()">Переподключить и применить</button></span></div>`:''}<h3>${active?'Действующие настройки VPN':'Настройки этого VPN'}</h3><div class="summary-row"><span class="summary-icon">${icon('network')}</span><div class="grow"><div class="summary-name">Сети через VPN</div><div class="summary-content">${shown.networks.length?shown.networks.slice(0,4).map(x=>`<span class="code-chip">${esc(x)}</span>`).join('')+(shown.networks.length>4?` и ещё ${shown.networks.length-4}`:''):'Не добавлены'}</div></div><button class="link" onclick="editProfile('${p.id}','networks')">Изменить</button></div><div class="summary-row"><span class="summary-icon">${icon('globe')}</span><div class="grow"><div class="summary-name">DNS для выбранных доменов</div><div class="summary-content">${shown.dns?`${esc(shown.domains.join(', ')||'Домены не добавлены')}<br><span class="mono">${esc(shown.dns)}</span> · через этот VPN`:'Используется системный DNS'}</ function filterProfiles(q){document.querySelectorAll('.profile-item').forEach(el=>el.classList.toggle('hidden',!profile(el.dataset.pid).name.toLowerCase().includes(q.toLowerCase())));}
function selectProfile(id){state.selected=id;render();}

document.addEventListener('click',e=>{const m=$('contextMenu');if(m&&!m.contains(e.target))m.remove();});
function requestConnect(id){if(isBusy())return;if(state.error==='cleanup'){modal('Сначала проверьте состояние сети','<p>Не подтверждено удаление маршрутов прошлого подключения. Новый VPN пока не запускается.</p><div class="notice amber">'+icon('info')+'<span>В этом макете восстановление реальной сети не реализовано. Используйте другой демонстрационный сценарий, чтобы сбросить пример ошибки.</span></div>',`<button class="btn" onclick="closeModal()">Отмена</button><button class="btn primary" onclick="closeModal();openDiagnostics()">Открыть проверку</button>`);return;}if(!state.engineAvailable){toast('Сначала настройте компонент sing-box.');return;}if(!profile(id).networks.length){modal('Добавьте хотя бы одну сеть','<p>Сейчас профиль не направляет ни одну IP-сеть через VPN. Добавьте нужные адреса; весь интернет автоматически не перехватывается.</p>',`<button class="btn" onclick="closeModal()">Отмена</button><button class="btn primary" onclick="closeModal();editProfile('${id}','networks')">Добавить сети</button>`);return;}if(state.active&&state.active!==id&&state.phase==='CONNECTED'){modal('Переключить VPN?',`<p><strong>${esc(activeProfile().name)}</strong> будет отключён, затем подключится <strong>${esc(profile(id).name)}</strong>.</p><div class="notice amber">${icon('info')}<span>Текущие рабочие соединения через VPN могут прерваться. Если новый VPN не подключится, прежний не восстановится автоматически.</span></div>`,`<button class="btn" onclick="closeModal()">Отмена</button><button class="btn primary" onclick="closeModal();connect('${id}',true)">Переключиться</button>`);return;}connect(id,false);}
function requestApply(){const id=state.active;modal('Применить сохранённые изменения?','<p>VPN будет отключён и запущен с сохранёнными настройками. Рабочие соединения через него могут прерваться.</p>',`<button class="btn" onclick="closeModal()">Отмена</button><button class="btn primary" onclick="closeModal();connect('${id}',true)">Переподключить</button>`);}
function addEvent(message,level='info',pid=state.selected,detail='Демонстрационное событие прототипа.'){state.events.unshift({time:new Date().toLocaleTimeString('ru-RU'),level,pid,message,detail});state.events=state.events.slice(0,300);}
function connect(id,switching){const token=++generation;state.target=id;state.error='';state.page='connections';state.selected=id;if(switching){state.phase='DISCONNECTING';addEvent('Начато переключение профиля');render();setTimeout(()=>{if(token!==generation)return;state.active=null;begin();},850);}else{state.active=null;begin();}function begin(){state.phase='CONNECTING';addEvent('Начато подключение','info',id);render();setTimeout(()=>{if(token!==generation)return;state.active=id;state.runtime=clone(profile(id));state.target=null;state.phase='CONNECTED';addEvent('Подключение установлено','info',id);render();toast('VPN подключён — демонстрационное состояние');},1550);}}
function disconnect(after){if(isBusy())return;const token=++generation;const old=state.active;state.phase='DISCONNECTING';state.target=old;state.page='connections';render();setTimeout(()=>{if(token!==generation)return;state.active=null;state.runtime=null;state.target=null;state.phase='DISCONNECTED';addEvent('VPN отключён','info',old);render();if(after)after();},850);}
function cancelConnect(){++generation;state.active=null;state.runtime=null;state.target=null;state.phase='DISCONNECTED';addEvent('Подключение отменено');render();toast('Подключение отменено');}

function closeModal(){const cancelAuth=authDialogOpen;authDialogOpen=false;state.modal=false;$('overlay').innerHTML='';if(modalOrigin&&document.contains(modalOrigin))modalOrigin.focus();if(cancelAuth)cancelConnect();}
function toast(text){clearTimeout(toastTimer);$('toast').innerHTML=`<div class="toast">${icon('check')}${esc(text)}</div>`;toastTimer=setTimeout(()=>$('toast').innerHTML='',3300);}
function showAdd(){modal('Добавить VPN','<p>Выберите, как добавить подключение. Оно не включится автоматически.</p>'+`<button class="choice" onclick="showFileImport()"><span class="choice-icon">${icon('file')}</span><span class="grow"><strong>Из файла</strong><small>Конфигурация OpenVPN или профиль приложения</small></span>${icon('arrow','arrow')}</button><button class="choice" onclick="showLinkImport()"><span class="choice-icon">${icon('link')}</span><span class="grow"><strong>По ссылке</strong><small>Вставьте ссылку VLESS</small></span>${icon('arrow','arrow')}</button><button class="choice" onclick="newProfile()"><span class="choice-icon">${icon('edit')}</span><span class="grow"><strong>Вручную</strong><small>Укажите сервер, доступ, сети и DNS</small></span>${icon('arrow','arrow')}</button>`);}
function showFileImport(){modal('Импорт из файла',`<p>Файл обрабатывается только внутри этой вкладки. В прототипе реализован ограниченный разбор .ovpn и собственного JSON-профиля.</p><button class="dropzone" style="width:100%" onclick="$ ('fileInput').click()">${icon('file')}<p>Выберите файл подключения</p><small>.ovpn или .json · не более 1 МБ</small></button><div class="divider"></div><button class="link" onclick="showImportPreview(clone(demoProfiles()[1]),['Импортирован демонстрационный профиль.','redirect-gateway не будет применён.'])">Посмотреть пример результата импорта</button>`,`<button class="btn" onclick="showAdd()">Назад</button>`);}
function showLinkImport(){modal('Добавление по ссылке',`<p>Вставьте ссылку подключения, которую вы получили. Ссылка может содержать ключ доступа — не публикуйте её.</p><div class="field"><label for="vpnLink">Ссылка VLESS</label><textarea id="vpnLink" placeholder="vless://…" spellcheck="false" autocomplete="off"></textarea><div class="field-error" id="linkError"></div></div><button class="link" onclick="$ ('vpnLink').value='vless://00000000-0000-4000-8000-000000000001@personal.example.com:443?security=tls&type=tcp&sni=personal.example.com#Personal'">Вставить демонстрационный пример</button>`,`<button class="btn" onclick="showAdd()">Назад</button><button class="btn primary" onclick="parseLink()">Продолжить</button>`);}
function parseLink(){let v=$('vpnLink').value.trim();try{const u=new URL(v);if(u.protocol!=='vless:')throw Error('Здесь поддерживаются только ссылки vless://.');if(!u.hostname||!u.username)throw Error('В ссылке нет адреса сервера или ключа доступа.');const allowed=new Set(['security','type','sni']);const unsupported=[...u.searchParams.keys()].filter(k=>!allowed.has(k));if(unsupported.length)throw Error('Прототип не разбирает параметры: '+unsupported.join(', ')+'. Они не будут молча отброшены. Используйте демонстрационный пример.');if((u.searchParams.get('security')||'tls')!=='tls'||(u.searchParams.get('type')||'tcp')!=='tcp')throw Error('В прототипе показан только импорт VLESS с TLS и TCP.');if(!/^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/i.test(decodeURIComponent(u.username)))throw Error('Ключ VLESS должен иметь формат UUID.');let p=clone(demoProfiles()[2]);p.name=decodeURIComponent(u.hash.slice(1))||'Новый VLESS';p.server=u.hostname;p.port=u.port||'443';p.uuid=decodeURIComponent(u.username);p.sni=u.searchParams.get('sni')||u.hostname;p.networks=[];p.dns='';p.domains=[];showImportPreview(p,['Ссылка не задаёт сети этого приложения. Добавьте их перед подключением.']);}catch(e){$('linkError').textContent=e.message||'Не удалось разобрать ссылку.';}}
$('fileInput').onchange=async e=>{const file=e.target.files[0];e.target.value='';if(!file)return;if(file.size>1048576){importError('Файл больше 1 МБ. Выберите конфигурацию меньшего размера.');return;}try{const text=await file.text();let p=clone(demoProfiles()[1]),notes=[];if(file.name.toLowerCase().endsWith('.json')){const d=JSON.parse(text);if(d.format!=='vpn-ui-profile-v1'||!d.profile||!['OpenVPN','VLESS'].includes(d.profile.type))throw Error('Ожидается JSON-профиль формата vpn-ui-profile-v1, а не произвольный sing-box.json.');const q=d.profile;p={...p,name:String(q.name||'Импортированный VPN'),type:q.type,server:String(q.server||''),port:String(q.port||''),networks:Array.isArray(q.networks)?q.networks.map(String):[],dns:String(q.dns||''),domains:Array.isArray(q.domains)?q.domains.map(String):[],username:'',uuid:'',ca:'',cert:'',key:'',sni:String(q.sni||'')};notes.push('Секреты и сертификаты не импортированы. Заполните вкладку «Доступ».');}else if(file.name.toLowerCase().endsWith('.ovpn')){const rem=text.match(/^\s*remote\s+(\S+)(?:\s+(\d+))?/m);if(!rem)throw Error('В файле не найден адрес remote.');const unsupported=[...text.matchAll(/^\s*(up|down|plugin|script-security|route-up|auth-user-pass-verify|redirect-gateway|compress|comp-lzo|http-proxy|socks-proxy|dev-type|dev)\s+([^\r\n]*)/gm)].filter(m=>!(m[1]==='dev'&&m[2].trim()==='tun')&&m[1]!=='redirect-gateway');if(unsupported.length)throw Error('В демонстрационном импортере не поддержаны параметры: '+[...new Set(unsupported.map(x=>x[1]))].join(', ')+'. Импорт остановлен; ничего не применено.');p.name=file.name.replace(/\.ovpn$/i,'');p.server=rem[1];p.port=rem[2]||'1194';p.transport=/^\s*proto\s+tcp/m.test(text)?'TCP':'UDP';p.networks=[];for(const m of text.matchAll(/^\s*route\s+([\d.]+)\s+([\d.]+)/gm)){const mask=ipNumber(m[2]);if(mask==null)throw Error('Некорректная маска сети.');const bits=mask.toString(2).padStart(32,'0');if(!/^1*0*$/.test(bits))throw Error('Некорректная маска сети.');const r=cidr(m[1]+'/'+(bits.match(/1/g)||[]).length);if(!r.ok)throw Error(r.error);p.networks.push(r.canonical);}p.dns=text.match(/^\s*dhcp-option\s+DNS\s+([\d.]+)/m)?.[1]||'';p.domains=[...text.matchAll(/^\s*dhcp-option\s+(?:DOMAIN|DOMAIN-SEARCH)\s+(\S+)/gm)].map(x=>x[1]);p.ca='';p.cert='';p.key='';p.username='';notes.push('Демонстрационный разбор: адрес сервера, порт, сети и DNS. Полный OpenVPN-импорт не реализован.','Сертификаты и прочие параметры нужно проверить во вкладке «Доступ».');if(/redirect-gateway/.test(text))notes.push('Запрос redirect-gateway не будет применён.');}else throw Error('Выберите .ovpn или .json.');showImportPreview(p,notes);}catch(err){importError(err.message||'Не удалось прочитать файл.');}};
function importError(msg){modal('Не удалось импортировать',`<div class="notice red">${icon('alert')}<span>${esc(msg)}</span></div><p style="margin-top:15px">Текущие подключения и сохранённые профили не изменены.</p>`,`<button class="btn" onclick="showFileImport()">Выбрать другой файл</button><button class="btn primary" onclick="closeModal()">Закрыть</button>`);}
let importedDraft=null;
function showImportPreview(p,notes=[]){importedDraft=p;modal('Проверьте импорт',`<p>Перед сохранением проверьте, что было распознано. Подключение не запускается.</p><div class="rule-table"><div class="rule-row"><span class="grow muted">Название</span><strong>${esc(p.name)}</strong></div><div class="rule-row"><span class="grow muted">Тип</span><span>${esc(p.type)}</span></div><div class="rule-row"><span class="grow muted">Сервер</span><span class="mono">${esc(p.server)}:${esc(p.port)}</span></div><div class="rule-row"><span class="grow muted">Сети / DNS-домены</span><span>${p.networks.length} / ${p.domains.length}</span></div></div>${notes.map(n=>`<div class="notice amber" style="margin-top:10px">${icon('info')}<span>${esc(n)}</span></div>`).join('')}`,`<button class="btn" onclick="showAdd()">Назад</button><button class="btn primary" onclick="createFromImport()">Перейти к настройкам</button>`,true);}
function createFromImport(){const p=clone(importedDraft);p.id='profile-'+Date.now();openEditor(p,true);closeModal();}
function newProfile(){const p=clone(demoProfiles()[1]);Object.assign(p,{id:'profile-'+Date.now(),name:'',server:'',username:'',cert:'',key:'',ca:'',networks:[],dns:'',domains:[]});openEditor(p,true);closeModal();}
function editProfile(id,tab='main'){if(isBusy()){toast('Дождитесь завершения операции с VPN.');return;}openEditor(clone(profile(id)),false,tab);}
function openEditor(p,isNew=false,tab='main'){state.draft=p;state.original=clone(p);state.isNew=isNew;state.dirty=false;state.editorTab=tab;state.page='editor';render();}
function changeField(key,value){state.draft[key]=value;state.dirty=true;}
function editorTab(tab){state.editorTab=tab;renderEditor();}
function renderEditor(){const p=state.draft;if(!p){state.page='connections';render();return;}const active=p.id===state.active&&state.phase==='CONNECTED';$('view').innerHTML=`<div class="editor"><div class="editor-head"><button class="link back" onclick="navigate('connections')">${icon('back')}К подключениям</button><div class="row between"><div><h1>${state.isNew?'Новый VPN':esc(p.name)}</h1><p class="small muted" style="margin-top:5px">${state.isNew?'Настройте профиль. Подключить его можно после сохранения.':'Настройки профиля'}</p></div>${active?'<span class="badge green"><span class="dot green"></span>Сейчас подключён</span>':''}</div><div class="subtabs" role="tablist">${[['main','Основное'],['access','Доступ'],['networks','Сети'],['dns','DNS']].map(([v,t])=>`<button role="tab" aria-selected="${v===state.editorTab}" class="${v===state.editorTab?'active':''}" onclick="editorTab('${v}')">${t}</button>`).join('')}</div></div><div class="editor-content"><div class="form">${active?`<div class="notice blue" style="margin-bottom:21px">${icon('info')}<span>Изменения подключения применятся после переподключения. До сохранения работающий VPN не меняется.</span></div>`:''}${editorFields()}</div></div><footer class="editor-footer"><button class="link" onclick="validateDraft()">${icon('check')}Проверить настройки</button><div class="row"><button class="btn" onclick="navigate('connections')">Отмена</button><button class="btn primary" onclick="saveDraft()">Сохранить</button></div></footer></div>`;}
function editorFields(){const p=state.draft;switch(state.editorTab){case'main':return `<div class="field"><label for="profileName">Название <span class="required">*</span></label><input id="profileName" value="${esc(p.name)}" placeholder="Например, рабочий VPN" maxlength="80" oninput="changeField('name',this.value)"><div class="hint">Название видно в списке подключений.</div></div><div class="field"><label for="profileType">Тип VPN</label><select id="profileType" onchange="changeType(this.value)" ${!state.isNew?'disabled':''}><option ${p.type==='OpenVPN'?'selected':''}>OpenVPN</option><option ${p.type==='VLESS'?'selected':''}>VLESS</option></select>${!state.isNew?'<div class="hint">Для другого типа подключения создайте новый профиль.</div>':''}</div><div class="fields-two"><div class="field"><label for="server">Адрес сервера <span class="required">*</span></label><input id="server" value="${esc(p.server)}" placeholder="vpn.example.com" spellcheck="false" oninput="changeField('server',this.value)"></div><div class="field"><label for="port">Порт <span class="required">*</span></label><input id="port" value="${esc(p.port)}" inputmode="numeric" oninput="changeField('port',this.value)"></div></div><div class="notice">${icon('info')}<span>Сюда нужен адрес VPN-сервера, не адрес корпоративного DNS.</span></div><details class="accordion"><summary>Дополнительные параметры подключения</summary><div class="field"><label for="transport">Транспорт</label><select id="transport" onchange="changeField('transport',this.value)">${(p.type==='OpenVPN'?['UDP','TCP']:['TCP']).map(v=>`<option ${p.transport===v?'selected':''}>${v}</option>`).join('')}</select><div class="hint">Прототип показывает минимальную форму. Неподдержанные параметры импорта нельзя терять молча.</div></div></details>`;
case'access':return p.type==='OpenVPN'?`<h3 class="form-section">Вход в VPN</h3><div class="field"><label for="username">Имя пользователя</label><input id="username" value="${esc(p.username)}" autocomplete="off" oninput="changeField('username',this.value)"></div><div class="field"><label for="password">Пароль VPN</label><div class="password-wrap"><input id="password" type="password" autocomplete="new-password" placeholder="Спрашивать при подключении" oninput="changeField('demoPassword',this.value)"><button class="btn icon" aria-label="Показать или скрыть пароль" onclick="togglePassword('password')">${icon('eye')}</button></div><div class="hint">Не пароль от компьютера. В этом прототипе не вводите настоящие секреты.</div></div><div class="divider"></div><h3 class="form-section">Сертификаты и ключ</h3>${fileField('ca','Сертификат центра (CA)',p.ca)}${fileField('cert','Сертификат пользователя',p.cert)}${fileField('key','Закрытый ключ',p.key)}<div class="hint small muted" style="margin-top:11px">Поля показываются по способу входа, поддержанному профилем. Содержимое закрытого ключа не выводится.</div>`:`<h3 class="form-section">Доступ VLESS</h3><div class="field"><label for="uuid">Ключ доступа (UUID) <span class="required">*</span></label><div class="password-wrap"><input id="uuid" type="password" value="${esc(p.uuid)}" autocomplete="off" oninput="changeField('uuid',this.value)"><button class="btn icon" aria-label="Показать или скрыть ключ" onclick="togglePassword('uuid')">${icon('eye')}</button></div><div class="hint">Обычно заполняется из ссылки подключения.</div></div><div class="field"><label for="sni">Имя сервера для TLS (SNI)</label><input id="sni" value="${esc(p.sni)}" placeholder="personal.example.com" spellcheck="false" oninput="changeField('sni',this.value)"></div><div class="notice">${icon('lock')}<span>В этой демонстрации показан VLESS с TLS и TCP. Другие варианты требуют отдельных проверенных полей, а не скрытого отключения проверки сертификата.</span></div>`;
case'networks':return `<h2 style="font-size:16px">Что направлять через VPN</h2><p class="muted small" style="margin-top:7px">Добавьте IP-адреса или сети, которым нужен этот VPN.</p><div class="rule-table">${p.networks.length?p.networks.map((n,i)=>`<div class="rule-row"><span class="mono">${esc(n)}</span><span class="label">${n.endsWith('/32')?'Один адрес':'Сеть'}</span><button class="btn icon ghost" aria-label="Изменить сеть ${esc(n)}" onclick="showNetwork(${i})">${icon('edit')}</button><button class="btn icon ghost" aria-label="Удалить сеть ${esc(n)}" onclick="removeRule('networks',${i})">${icon('close')}</button></div>`).join(''):'<div class="empty-events">Сетей пока нет. Добавьте адреса для подключения.</div>'}</div><button class="btn sm" onclick="showNetwork()">${icon('plus')}Добавить сеть</button><div class="notice mt">${icon('info')}<span><strong>Другие адреса остаются по настройкам системы.</strong><br>Например, <code>10.20.0.0/16</code> — сеть, а <code>10.20.5.17/32</code> — один адрес. Весь интернет через этот VPN не направляется.</span></div><div class="notice blue mt">${icon('globe')}<span>Домены на вкладке DNS выбирают DNS-сервер, но сами по себе не добавляют маршруты к сайтам.</span></div>`;
case'dns':return `<h2 style="font-size:16px">DNS для выбранных доменов</h2><p class="muted small" style="margin-top:7px;margin-bottom:20px">Например, чтобы открывались внутренние адреса компании.</p><div class="field"><label for="dnsServer">DNS-сервер этого VPN</label><input id="dnsServer" value="${esc(p.dns)}" placeholder="10.20.0.53" spellcheck="false" oninput="changeField('dns',this.value)" onblur="renderDnsWarning()"><div class="hint">Один IP-адрес. Оставьте пустым, если отдельный DNS не нужен.</div></div><div class="field-label">Домены для этого DNS</div><div class="rule-table">${p.domains.length?p.domains.map((n,i)=>`<div class="rule-row"><span class="mono">${esc(n)}</span><span class="label">Включая поддомены</span><button class="btn icon ghost" aria-label="Удалить домен ${esc(n)}" onclick="removeRule('domains',${i})">${icon('close')}</button></div>`).join(''):'<div class="empty-events">Домены не добавлены.</div>'}</div><button class="btn sm" onclick="showDomain()">${icon('plus')}Добавить домен</button><div id="dnsWarning" class="mt">${dnsWarning()}</div><div class="notice mt">${icon('info')}<span><strong>Остальные домены — через системный DNS.</strong><br>Настройка DNS не означает, что весь трафик к этим доменам пойдёт через VPN. Для этого IP-адрес назначения должен входить в выбранные сети.</span></div><p class="small muted" style="margin-top:12px">Фактическую работу DNS можно проверить в разделе «Журнал → Проверка» после подключения.</p>`;}}
function fileField(key,label,value){return `<div class="file-row"><span class="row">${icon(key==='key'?'key':'file')}<span>${label}<small>${value?esc(value):'Не выбран'}</small></span></span><button class="btn sm" onclick="chooseCert('${key}')">${value?'Заменить':'Выбрать'}</button></div>`;}
function chooseCert(key){state.certTarget=key;$('certInput').click();}
$('certInput').onchange=e=>{const f=e.target.files[0];e.target.value='';if(!f)return;changeField(state.certTarget,f.name);renderEditor();toast('Выбрано имя файла. Содержимое ключа прототип не читает.');};
function togglePassword(id){const e=$(id);e.type=e.type==='password'?'text':'password';}
function changeType(type){changeField('type',type);state.draft.port=type==='OpenVPN'?'1194':'443';state.draft.transport=type==='OpenVPN'?'UDP':'TCP';renderEditor();}
function removeRule(key,index){state.draft[key].splice(index,1);state.dirty=true;renderEditor();}
function ipNumber(str){const parts=String(str).trim().split('.');if(parts.length!==4||parts.some(x=>!/^\d{1,3}$/.test(x)||+x>255))return null;return parts.reduce((a,x)=>a*256+Number(x),0);}
function ipText(n){return[24,16,8,0].map(b=>Math.floor(n/2**b)%256).join('.');}
function cidr(str){const s=String(str).trim();if(s.includes(':'))return{ok:false,error:'В этом HTML-прототипе проверяется только IPv4. Поддержку IPv6 нужно определить отдельно в реализации.'};const parts=s.split('/');if(parts.length>2)return{ok:false,error:'Введите сеть в формате 10.20.0.0/16.'};const num=ipNumber(parts[0]);const bits=parts.length===1?32:Number(parts[1]);if(parts.length===2&&!/^\d{1,2}$/.test(parts[1]))return{ok:false,error:'Укажите маску после /. Например, /16.'};if(num===null||!/^(\d|[12]\d|3[0-2])$/.test(String(bits)))return{ok:false,error:'Некорректный IPv4-адрес или маска. Пример: 10.20.0.0/16.'};if(bits===0)return{ok:false,error:'Весь интернет через VPN не поддержан этим MVP. Укажите конкретную сеть.'};const size=2**(32-bits),start=Math.floor(num/size)*size;return{ok:true,start,end:start+size-1,bits,canonical:ipText(start)+'/'+bits,normalized:s!==ipText(start)+'/'+bits};}
function coversAll(nets){const spans=nets.map(cidr).filter(x=>x.ok).sort((a,b)=>a.start-b.start);let end=-1;for(const r of spans){if(r.start>end+1)break;end=Math.max(end,r.end);}return end>=4294967295;}
let editNetworkIndex=-1;
function showNetwork(index=-1){editNetworkIndex=index;modal(index>=0?'Изменить сеть':'Добавить сеть',`<p>Укажите сеть или один IP-адрес назначения.</p><div class="field"><label for="networkInput">IP-адрес или сеть</label><input id="networkInput" value="${index>=0?esc(state.draft.networks[index]):''}" placeholder="10.20.0.0/16" spellcheck="false"><div class="hint">Один IP будет предложен с маской /32.</div><div id="networkError" class="field-error"></div></div>`,`<button class="btn" onclick="closeModal()">Отмена</button><button class="btn primary" onclick="addNetwork()">${index>=0?'Сохранить':'Добавить'}</button>`);}
function addNetwork(){const input=$('networkInput'),r=cidr(input.value);if(!r.ok){$('networkError').textContent=r.error;return;}if(r.normalized){input.value=r.canonical;$('networkError').textContent='Приведено к '+r.canonical+'. Проверьте сеть и нажмите кнопку ещё раз.';return;}const others=state.draft.networks.filter((_,i)=>i!==editNetworkIndex);if(others.includes(r.canonical)){$('networkError').textContent='Такая сеть уже добавлена.';return;}if(coversAll([...others,r.canonical])){$('networkError').textContent='В сумме сети охватывают весь IPv4-интернет. Для этого MVP так делать нельзя.';return;}if(editNetworkIndex>=0)state.draft.networks[editNetworkIndex]=r.canonical;else state.draft.networks.push(r.canonical);state.dirty=true;closeModal();renderEditor();}
function dnsCovered(p){const n=ipNumber(p.dns);return n!==null&&p.networks.some(net=>{const r=cidr(net);return r.ok&&n>=r.start&&n<=r.end;});}
function dnsWarning(){const p=state.draft;if(!p.dns)return '';if(ipNumber(p.dns)===null)return `<div class="notice red">${icon('alert')}<span>Введите корректный IP-адрес DNS-сервера. Пример: 10.20.0.53.</span></div>`;if(!dnsCovered(p))return `<div class="notice amber">${icon('alert')}<span>DNS <code>${esc(p.dns)}</code> не входит в выбранные сети.<br>В этой схеме ему нужен отдельный маршрут через VPN.<br><button class="link" onclick="addDnsRoute()">Добавить ${esc(p.dns)}/32 в сети</button></span></div>`;return `<div class="notice">${icon('check')}<span>По настройкам адрес DNS входит в сети этого VPN. Его доступность ещё не проверена.</span></div>`;}
function renderDnsWarning(){if($('dnsWarning'))$('dnsWarning').innerHTML=dnsWarning();}
function addDnsRoute(){const n=state.draft.dns.trim()+'/32';if(!state.draft.networks.includes(n))state.draft.networks.push(n);state.dirty=true;renderEditor();toast('Адрес DNS добавлен в сети. Сохраните профиль.');}
function showDomain(){modal('Добавить домен',`<p>Все поддомены тоже будут использовать DNS этого VPN. Например, company.local и git.company.local.</p><div class="field"><label for="domainInput">Домен</label><input id="domainInput" placeholder="company.local" spellcheck="false"><div class="hint">Без https://, порта, пути и звёздочки.</div><div id="domainError" class="field-error"></div></div>`,`<button class="btn" onclick="closeModal()">Отмена</button><button class="btn primary" onclick="addDomain()">Добавить</button>`);}
function validDomain(s){return s.length<=253&&s.includes('.')&&s.split('.').every(x=>x.length>0&&x.length<=63&&/^[a-z0-9](?:[a-z0-9-]*[a-z0-9])?$/i.test(x));}
function addDomain(){const val=$('domainInput').value.trim().toLowerCase().replace(/\.$/,'');if(!validDomain(val)){$('domainError').textContent='Введите домен без протокола, пути или *. Например, company.local.';return;}if(state.draft.domains.includes(val)){$('domainError').textContent='Этот домен уже есть в списке.';return;}state.draft.domains.push(val);state.dirty=true;closeModal();renderEditor();}
function errorsForDraft(){const p=state.draft,errors=[];if(!p.name.trim())errors.push(['main','Введите название VPN.']);if(!p.server.trim()||/[\s/]/.test(p.server)||p.server.includes('://'))errors.push(['main','Укажите адрес VPN-сервера без протокола и пути.']);if(!/^\d+$/.test(p.port)||+p.port<1||+p.port>65535)errors.push(['main','Порт должен быть от 1 до 65535.']);if(!p.networks.length)errors.push(['networks','Добавьте хотя бы одну сеть для подключения.']);for(const n of p.networks){const r=cidr(n);if(!r.ok)errors.push(['networks',r.error]);}if(coversAll(p.networks))errors.push(['networks','Сети не должны охватывать весь IPv4-интернет.']);if(p.dns&&ipNumber(p.dns)===null)errors.push(['dns','Введите корректный IPv4-адрес DNS-сервера.']);if(p.domains.length&&!p.dns)errors.push(['dns','Указаны DNS-домены, но не указан DNS-сервер.']);if(p.dns&&!p.domains.length)errors.push(['dns','Укажите домены для корпоративного DNS или очистите поле DNS.']);if(p.dns&&ipNumber(p.dns)!==null&&!dnsCovered(p))errors.push(['dns','Адрес DNS не входит в сети VPN. Добавьте маршрут к DNS.']);if(p.domains.some(d=>!validDomain(d)))errors.push(['dns','Исправьте формат DNS-доменов.']);if(p.type==='VLESS'&&!/^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/i.test(p.uuid))errors.push(['access','Укажите ключ VLESS в формате UUID.']);return errors;}
function validateDraft(){const errors=errorsForDraft();modal(errors.length?'Проверьте настройки':'Поля заполнены корректно',errors.length?`<p>Ниже — что нужно исправить. Работающее подключение не изменено.</p>${errors.map(([t,m])=>`<div class="notice red" style="margin:9px 0">${icon('alert')}<span>${esc(m)}<br><button class="link" onclick="closeModal();editorTab('${t}')">Перейти к полю</button></span></div>`).join('')}`:`<div class="step">${icon('check')}Название, сервер и порт</div><div class="step">${icon('check')}Формат сетей и DNS</div><div class="notice blue mt">${icon('info')}<span>Это только проверка полей HTML-прототипа. sing-box не запускался; сертификаты, конфигурация движка и доступность сервера не проверены.</span></div>`,`<button class="btn primary" onclick="closeModal()">Понятно</button>`);return !errors.length;}
function saveDraft(){if(errorsForDraft().length){validateDraft();return;}const a=clone(state.original),b=clone(state.draft);delete a.name;delete b.name;const reconnect=state.draft.id===state.active&&state.phase==='CONNECTED'&&JSON.stringify(a)!==JSON.stringify(b);if(reconnect){modal('Применить изменения?',`<p>Профиль <strong>${esc(state.draft.name)}</strong> сейчас подключён.</p><div class="notice amber">${icon('info')}<span>Для новых настроек потребуется переподключение. Рабочие соединения через VPN могут прерваться.</span></div>`,`<button class="btn ghost" onclick="closeModal()">Отмена</button><button class="btn" onclick="commitDraft(false)">Сохранить на потом</button><button class="btn primary" onclick="commitDraft(true)">Переподключить</button>`,true);}else commitDraft(false);}
function commitDraft(reconnect){const p=clone(state.draft);delete p.demoPassword;const i=state.profiles.findIndex(x=>x.id===p.id);if(i>=0)state.profiles[i]=p;else state.profiles.push(p);state.selected=p.id;state.dirty=false;state.page='connections';closeModal();render();if(reconnect)connect(p.id,true);else toast(pendingChanges(p.id)?'Профиль сохранён. Сетевые изменения — при следующем подключении.':'Профиль сохранён');}
let unsavedAction=null;
function showUnsaved(action){unsavedAction=action;modal('Есть несохранённые изменения','<p>Введённые настройки будут потеряны. Работающий VPN останется без изменений.</p>',`<button class="btn" onclick="closeModal()">Продолжить редактирование</button><button class="btn primary" onclick="discardChanges()">Не сохранять</button>`);}
function discardChanges(){state.dirty=false;const action=unsavedAction;closeModal();if(action)action();}
function duplicateProfile(){const p=clone(selected());p.id='profile-'+Date.now();p.name+=' — копия';p.username='';p.uuid='';p.cert='';p.key='';openEditor(p,true);toast('Создан черновик копии без секретов.');}
function showDelete(){const p=selected();modal(p.id===state.active?'Удалить подключённый VPN?':'Удалить профиль?',`<p>Профиль <strong>${esc(p.name)}</strong> будет удалён из этого приложения. Другие VPN и исходные файлы не удаляются.</p>${p.id===state.active?`<div class="notice amber">${icon('alert')}<span>Сначала отключится этот VPN. Соединения через него прервутся.</span></div>`:''}`,`<button class="btn" onclick="closeModal()">Отмена</button><button class="btn danger" onclick="deleteSelected()">${p.id===state.active?'Отключить и удалить':'Удалить профиль'}</button>`);}
function deleteSelected(){const id=state.selected;closeModal();const remove=()=>{state.profiles=state.profiles.filter(x=>x.id!==id);state.selected=state.profiles[0]?.id;render();toast('Профиль удалён');};if(id===state.active)disconnect(remove);else remove();}
function safeProfile(p){return{format:'vpn-ui-profile-v1',secretsIncluded:false,profile:{name:p.name,type:p.type,server:p.server,port:p.port,transport:p.transport,networks:p.networks,dns:p.dns,domains:p.domains,sni:p.sni}};}
function showExport(){const p=selected();modal('Экспорт профиля',`<p>Будут сохранены настройки профиля <strong>${esc(p.name)}</strong>.</p><div class="step">${icon('check')}Название, сервер, сети и DNS</div><div class="step">${icon('lock')}Без пароля, UUID, ключей и сертификатов</div><div class="notice amber mt">${icon('info')}<span>Файл всё ещё содержит адрес сервера и названия внутренних доменов. Не отправляйте его публично. После импорта доступ нужно настроить заново.</span></div>`,`<button class="btn" onclick="closeModal()">Отмена</button><button class="btn primary" onclick="exportProfile()">Сохранить файл</button>`);}
function downloadText(name,text,type='text/plain'){const url=URL.createObjectURL(new Blob([text],{type}));const a=document.createElement('a');a.href=url;a.download=name;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),1000);}
function exportProfile(){downloadText('vpn-profile.json',JSON.stringify(safeProfile(selected()),null,2),'application/json');closeModal();toast('Профиль экспортирован без секретов');}
function openErrorLog(){state.page='journal';state.journalTab='events';state.logProfile=state.selected;state.logLevel='error';render();}
function openDiagnostics(){state.page='journal';state.journalTab='check';render();}
function renderJournal(){const check=state.journalTab==='check';$('view').innerHTML=`<section class="page"><div class="page-head"><div><h1>Журнал</h1><p>События и проверка подключения — в одном месте.</p></div>${!check?'<button class="btn sm" onclick="exportEvents()">'+icon('download')+'Экспорт журнала</button>':''}</div><div class="subtabs"><button class="${!check?'active':''}" onclick="state.journalTab='events';renderJournal()">События</button><button class="${check?'active':''}" onclick="state.journalTab='check';renderJournal()">Проверка</button></div>${check?diagnosticsHTML():eventsHTML()}</section>`;if(!check)renderEventRows();}
function eventsHTML(){return `<div class="filters"><select aria-label="Фильтр по профилю" onchange="state.logProfile=this.value;renderEventRows()"><option value="all">Все профили</option>${state.profiles.map(p=>`<option value="${p.id}" ${state.logProfile===p.id?'selected':''}>${esc(p.name)}</option>`).join('')}</select><select aria-label="Уровень событий" onchange="state.logLevel=this.value;renderEventRows()">${[['all','Все события'],['error','Ошибки'],['warning','Предупреждения'],['info','Информация']].map(([v,t])=>`<option value="${v}" ${state.logLevel===v?'selected':''}>${t}</option>`).join('')}</select><input aria-label="Поиск в журнале" placeholder="Найти в журнале" value="${esc(state.logQuery)}" oninput="state.logQuery=this.value;renderEventRows()"></div><div class="event-container"><table class="event-table"><thead><tr><th>Время</th><th>Уровень</th><th>Профиль</th><th>Событие</th></tr></thead><tbody id="eventRows"></tbody></table><div id="eventsEmpty"></div></div><div id="eventDetail"></div><div class="footer-meta"><span>Нажмите событие, чтобы открыть подробности.</span><button class="link" onclick="clearEvents()">Очистить экран</button></div>`;}
function filteredEvents(){return state.events.filter(e=>(state.logProfile==='all'||e.pid===state.logProfile)&&(state.logLevel==='all'||e.level===state.logLevel)&&(`${e.message} ${e.detail}`).toLowerCase().includes(state.logQuery.toLowerCase()));}
function renderEventRows(){if(!$('eventRows'))return;const list=filteredEvents();$('eventRows').innerHTML=list.map(e=>{const i=state.events.indexOf(e);return `<tr data-event="${i}" tabindex="0" onclick="showEvent(${i})" onkeydown="if(event.key==='Enter')showEvent(${i})"><td class="mono">${e.time}</td><td><span class="badge ${e.level==='error'?'red':e.level==='warning'?'amber':''}" style="font-size:11px">${e.level==='error'?'Ошибка':e.level==='warning'?'Внимание':'Инфо'}</span></td><td>${esc(profile(e.pid)?.name||'Удалённый профиль')}</td><td>${esc(e.message)}</td></tr>`;}).join('');$('eventsEmpty').innerHTML=list.length?'':'<div class="empty-events">Нет событий по выбранным фильтрам.<br><button class="link mt" onclick="state.logLevel=\'all\';state.logProfile=\'all\';state.logQuery=\'\';renderJournal()">Сбросить фильтры</button></div>';if($('eventDetail'))$('eventDetail').innerHTML='';}
function showEvent(i){const e=state.events[i];state.eventSelected=i;$('eventDetail').innerHTML=`<div class="event-detail"><div class="row between"><strong>${esc(e.message)}</strong><button class="link" onclick="copyEvent()">${icon('copy')}Копировать</button></div><code>${esc(e.detail)}</code><span class="muted">Технические сведения для разбора ошибки. Секреты исключаются до записи в журнал.</span></div>`;}
async function copyText(text){try{if(navigator.clipboard&&window.isSecureContext)await navigator.clipboard.writeText(text);else{const t=document.createElement('textarea');t.value=text;t.style.position='fixed';t.style.opacity='0';document.body.appendChild(t);t.select();if(!document.execCommand('copy'))throw Error();t.remove();}toast('Текст скопирован');}catch{modal('Текст для копирования',`<textarea readonly style="height:170px">${esc(text)}</textarea>`,`<button class="btn primary" onclick="closeModal()">Закрыть</button>`);}}
function copyEvent(){const e=state.events[state.eventSelected];if(e)copyText(`${e.time} ${e.message}\n${e.detail}`);}
function clearEvents(){state.events=[];renderJournal();toast('Экран журнала очищен');}
function exportEvents(){modal('Экспорт журнала','<p>Будут сохранены видимые по фильтрам демонстрационные события. Настоящие журналы могут содержать адреса и имена — проверьте файл перед передачей.</p><div class="notice">'+icon('lock')+'<span>Пароли, ссылки с ключами доступа и закрытые ключи не должны попадать в журнал вообще.</span></div>',`<button class="btn" onclick="closeModal()">Отмена</button><button class="btn primary" onclick="downloadText('vpn-demo-events.txt',filteredEvents().map(e=>e.time+' '+e.level+' '+e.message+'\\n'+e.detail).join('\\n\\n'));closeModal()">Сохранить файл</button>`);}
function diagnosticsHTML(){const done=state.diagDone;return `<div style="max-width:720px"><div class="row between"><div><h2 style="font-size:16px">Почему адрес не открывается</h2><p class="muted small" style="margin-top:5px">Проверка не меняет настройки других подключений.</p></div><button class="btn primary sm" onclick="runDiagnostics()" id="diagBtn">${icon('refresh')}Проверить</button></div><div class="row" style="margin-top:18px"><label for="diagProfile" class="small muted">Профиль</label><select id="diagProfile" style="width:230px;min-height:34px;font-size:12px" onchange="state.selected=this.value;state.diagDone=false;renderJournal()">${state.profiles.map(q=>`<option value="${q.id}" ${q.id===state.selected?'selected':''}>${esc(q.name)}</option>`).join('')}</select></div><div class="diagnostic">${diagnosticRows()}</div><div class="fields-two" style="grid-template-columns:1fr auto;align-items:end"><div class="field" style="margin:0"><label for="testAddress">Адрес для разбора по настройкам</label><input id="testAddress" value="git.company.local" spellcheck="false"></div><button class="btn" onclick="checkAddress()">Разобрать</button></div><div id="addressResult" class="mt"></div><div class="notice mt">${icon('info')}<span><strong>Это демонстрация проверки, не диагностика вашего компьютера.</strong><br>В реальном приложении отдельно показываются «По настройкам» и «Проверено запросом». Отсутствие ответа не всегда означает, что VPN отключён.</span></div><div class="footer-meta"><span>Для проверки нужен выбранный профиль.</span><button class="link" onclick="showReport()">${icon('download')}Сохранить отчёт</button></div></div>`;}
function diagnosticRows(){const p=selected(),ready=state.phase==='CONNECTED'&&state.active===state.selected,done=state.diagDone;const rows=[['Сетевой компонент',state.engineAvailable?'Доступен · демонстрация':'Не найден',state.engineAvailable?'check':'alert'],['Конфигурация профиля',state.engineAvailable&&p?'Поля корректны · демонстрация':'Не выполнено: нет компонента/профиля',state.engineAvailable&&p?'check':'clock'],['VPN и выбранные маршруты',ready?'Сопоставлены · демонстрация':'Не выполнено: профиль отключён',ready?'check':'clock'],['Запрос к DNS через VPN',ready&&p?.dns?'Ответ получен · демонстрация':!p?.dns?'Отдельный DNS не настроен':'Не выполнено: профиль отключён',ready&&p?.dns?'check':'clock'],['Другие настройки системы',ready?'Сравнение до/после · демонстрация':'Сравнение не выполнено',ready?'check':'clock']];return rows.map(([title,result,sym])=>`<div class="diag-row">${icon(done?sym:'clock',done&&sym==='check'?'ok':done&&sym==='alert'?'warn':'pending')}<span class="grow">${title}</span><span class="result">${done?result:'Не проверено'}</span></div>`).join('');}
function runDiagnostics(){const b=$('diagBtn');if(b){b.disabled=true;b.innerHTML='<span class="spinner"></span>Проверка…';}const t=generation;setTimeout(()=>{if(t!==generation)return;state.diagDone=true;if(state.page==='journal'&&state.journalTab==='check')renderJournal();toast('Показаны демонстрационные результаты проверки');},1050);}
function checkAddress(){const p=selected(),input=$('testAddress').value.trim().toLowerCase();if(!p){toast('Сначала добавьте профиль');return;}const n=ipNumber(input);let html='';if(n!==null){const match=p.networks.find(net=>{const r=cidr(net);return r.ok&&n>=r.start&&n<=r.end;});html=`<strong>По настройкам профиля ${esc(p.name)}</strong><br>${match?`Совпала сеть ${esc(match)}. Направление — этот VPN.`:'Совпадений нет. Направление — по настройкам системы.'}<br>Фактический маршрут в системе не проверялся.`;}else if(validDomain(input)){const d=p.domains.filter(d=>input===d||input.endsWith('.'+d)).sort((a,b)=>b.length-a.length)[0];html=`<strong>По настройкам профиля ${esc(p.name)}</strong><br>${d?`Совпало DNS-правило ${esc(d)}. DNS-сервер — ${esc(p.dns)}.`:'DNS-правило не совпало. Используется системный DNS.'}<br>IP-адрес не запрашивался. Маршрут к сайту можно определить только после ответа DNS.`;}else html='Введите домен без https:// или один IPv4-адрес.';$('addressResult').innerHTML=`<div class="notice blue">${icon('network')}<span>${html}</span></div>`;}
function showReport(){modal('Сохранить отчёт проверки',`<p>По умолчанию экспортируются только типы проверок и их состояния. Адреса, домены и названия профилей скрываются.</p><label class="checkrow"><input type="checkbox" id="includeAddresses">Добавить адреса и имена из профиля</label><div class="notice amber mt">${icon('info')}<span>Даже без паролей адреса и домены могут быть внутренними данными компании. Просмотрите отчёт перед отправкой.</span></div>`,`<button class="btn" onclick="closeModal()">Отмена</button><button class="btn primary" onclick="exportReport()">Сохранить</button>`);}
function exportReport(){const addresses=$('includeAddresses').checked;const body={kind:'Демонстрационный отчёт, не проверка системы',checksShown:state.diagDone,profile:addresses&&selected()?safeProfile(selected()).profile:'[адреса и имена скрыты]',secretsIncluded:false};downloadText('vpn-demo-report.json',JSON.stringify(body,null,2),'application/json');closeModal();}
function renderSettings(){const general=state.settingsTab==='general';$('view').innerHTML=`<section class="page narrow"><div class="page-head"><div><h1>Настройки</h1><p>Поведение приложения. Сети и DNS настраиваются в профиле VPN.</p></div></div><div class="subtabs"><button class="${general?'active':''}" onclick="state.settingsTab='general';renderSettings()">Общие</button><button class="${!general?'active':''}" onclick="state.settingsTab='components';renderSettings()">Компоненты и данные</button></div>${general?generalSettings():componentsSettings()}<div class="footer-meta"><span>Изменения здесь сохраняются сразу · в памяти прототипа</span><button class="link" onclick="showAbout()">О программе</button></div></section>`;}
function generalSettings(){return `<h3 class="form-section">Работа приложения</h3><div class="settings-section"><div class="setting-row"><div><h3>Запускать при входе в систему</h3><p>Открыть приложение, но не подключать VPN автоматически.</p></div><button role="switch" aria-label="Запускать при входе" aria-checked="${state.settings.startup}" class="switch ${state.settings.startup?'on':''}" onclick="toggleSetting('startup')"></button></div><div class="setting-row"><div><h3>При закрытии окна</h3><p>Что делать с приложением и работающим VPN.</p></div><select aria-label="Действие при закрытии" onchange="state.settings.close=this.value;toast('Настройка сохранена в памяти прототипа')">${[['ask','Спрашивать'],['tray','Скрывать в трей'],['quit','Отключать VPN и выходить']].map(([v,t])=>`<option value="${v}" ${state.settings.close===v?'selected':''}>${t}</option>`).join('')}</select></div><div class="setting-row"><div><h3>Сообщать об ошибках и обрыве</h3><p>Без постоянных уведомлений об обычных действиях.</p></div><button role="switch" aria-label="Уведомления об ошибках" aria-checked="${state.settings.notifications}" class="switch ${state.settings.notifications?'on':''}" onclick="toggleSetting('notifications')"></button></div></div><div class="notice">${icon('info')}<span>Автозапуск и трей — предложенные дополнения к исходной спецификации. Здесь показано их поведение, системные настройки компьютера не изменяются.</span></div>`;}
function componentsSettings(){return `<h3 class="form-section">Сетевой компонент</h3><div class="settings-section"><div class="setting-row"><div><h3>sing-box</h3><p>${state.engineAvailable?'Компонент в комплекте приложения · демо':'Не найден или недоступен'}</p></div><span class="badge ${state.engineAvailable?'green':'red'}">${state.engineAvailable?'Доступен':'Недоступен'}</span></div><div class="setting-row"><div><h3>Поддерживаемые подключения</h3><p>Список определяется возможностями установленного компонента.</p></div><span class="small">${state.engineAvailable?'OpenVPN · VLESS':'—'}</span></div><div class="setting-row"><div><h3>Проверка компонента</h3><p>Версия, запуск и доступность нужных возможностей.</p></div><button class="btn sm" onclick="demoEngineCheck()">Проверить</button></div></div><h3 class="form-section">Данные приложения</h3><div class="settings-section"><div class="setting-row"><div><h3>Профили и журналы</h3><p>Отдельная папка для данных приложения.</p></div><button class="btn sm" onclick="showDataFolder()">Показать расположение</button></div></div><div class="notice">${icon('lock')}<span>Пароли и закрытые ключи не показываются здесь. В реализации для них нужно отдельно определить безопасное хранилище.</span></div>`;}
function toggleSetting(key){state.settings[key]=!state.settings[key];renderSettings();toast('Настройка сохранена в памяти прототипа');}
function demoEngineCheck(){if(!state.engineAvailable){modal('Компонент недоступен','<p>Подключение недоступно, но профили можно просматривать и редактировать. В реальном приложении здесь нужны инструкции для выбранного способа установки.</p><div class="notice">'+icon('info')+'<span>Кнопка ниже только восстанавливает демонстрационное состояние компонента.</span></div>',`<button class="btn" onclick="closeModal()">Закрыть</button><button class="btn primary" onclick="state.engineAvailable=true;closeModal();render();toast('Демонстрационный компонент доступен')">Восстановить демо</button>`);}else toast('Компонент доступен — демонстрационный результат');}
function showDataFolder(){modal('Данные приложения','<p>В реальном приложении кнопка открывает системную папку данных. HTML-прототип не имеет доступа к папкам вашего VPN.</p><div class="rule-table"><div class="rule-row"><span class="mono">profiles/</span><span class="muted small">Сохранённые профили</span></div><div class="rule-row"><span class="mono">runtime/</span><span class="muted small">Собранная конфигурация</span></div></div>',`<button class="btn primary" onclick="closeModal()">Понятно</button>`);}
function showAbout(){modal('О программе',`<div class="row" style="margin:4px 0 17px"><span class="brand-mark">${icon('shield')}</span><strong>VPN · концепция интерфейса</strong></div><div class="help-list"><p>Целевые платформы: Windows и macOS.</p><p>По спецификации: Java 21 + JavaFX, один sing-box, один активный VPN-профиль.</p><p>HTML нужен только для проверки интерфейса. Это не работающий VPN и не JavaFX-сборка.</p><p>Ни сеть, ни системный DNS, ни маршруты вашего компьютера этот файл не изменяет.</p></div>`,`<button class="btn primary" onclick="closeModal()">Закрыть</button>`);}
function showAuth(){modal('Вход в RGF Moscow',`<p>Серверу нужны данные для входа в VPN. Отмена остановит текущую попытку подключения.</p><div class="field"><label for="authUser">Имя пользователя</label><input id="authUser" value="user" autocomplete="off"></div><div class="field"><label for="authPass">Пароль VPN</label><div class="password-wrap"><input id="authPass" type="password" placeholder="Не вводите настоящий пароль" autocomplete="new-password"><button class="btn icon" aria-label="Показать пароль" onclick="togglePassword('authPass')">${icon('eye')}</button></div></div><div class="notice">${icon('lock')}<span>Это не системный пароль. Прототип не проверяет учётные данные и не сохраняет их.</span></div>`,`<button class="btn" onclick="closeModal()">Отмена</button><button class="btn primary" onclick="authDialogOpen=false;closeModal();connect('moscow',false)">Продолжить</button>`);authDialogOpen=true;}
function showPermission(){modal('Разрешите работу VPN',`<p>Приложению нужно создать виртуальный сетевой интерфейс для выбранных сетей.</p><div class="notice blue">${icon('shield')}<span>В реальном приложении дальше откроется системное окно подтверждения. Системный пароль вводится только там, не в форме приложения.</span></div><p style="margin-top:15px">В прототипе показано только это объяснение. Запрос прав не выполняется.</p>`,`<button class="btn" onclick="closeModal()">Не сейчас</button><button class="btn primary" onclick="closeModal();connect('moscow',false)">Продолжить · демо</button>`);}
function showTray(){closeModal();const p=activeProfile();$('overlay').innerHTML=`<div class="tray-layer" onclick="if(event.target===this)closeModal()"><section class="tray" role="dialog" aria-label="Компактный режим VPN"><div class="row between"><strong>VPN</strong><button class="btn icon ghost" aria-label="Закрыть компактный режим" onclick="closeModal()">${icon('close')}</button></div><div class="row" style="margin:9px 0 14px"><span class="dot ${p&&state.phase==='CONNECTED'?'green':''}"></span><div><div class="tray-title">${p?esc(p.name):'VPN отключён'}</div><small class="muted">${p?'Для выбранных сетей':'Выберите профиль для подключения'}</small></div></div>${p?'<button class="btn" style="width:100%" onclick="closeModal();disconnect()">Отключить</button>':''}<div class="tray-divider"></div><div class="eyebrow" style="font-size:10px">Переключить профиль</div>${state.profiles.map(q=>`<button class="tray-item" onclick="closeModal();state.selected='${q.id}';state.page='connections';render();${q.id!==state.active?`requestConnect('${q.id}')`:''}"><span class="dot ${q.id===state.active?'green':''}"></span><span class="grow">${esc(q.name)}</span>${q.id===state.active?icon('check'):icon('arrow')}</button>`).join('')}<div class="tray-divider"></div><button class="tray-item" onclick="closeModal();navigate('connections')">Открыть приложение</button><button class="tray-item" onclick="showExit()">Завершить работу</button><p class="small muted" style="margin-top:10px">Макет панели трея. Не системный трей браузера.</p></section></div>`;state.modal=true;}
function showExit(){if(state.page==='editor'&&state.dirty){showUnsaved(()=>showExit());return;}modal('Завершить работу?',state.active?`<p>Сейчас подключён <strong>${esc(activeProfile()?.name)}</strong>. При завершении работы он будет отключён.</p><div class="notice">${icon('info')}<span>Чтобы VPN продолжал работать, скройте окно в трей. В исходной спецификации фоновый сервис отдельно не предусмотрен.</span></div>`:'<p>VPN не подключён. Можно завершить работу приложения или скрыть его окно.</p>',`<button class="btn ghost" onclick="closeModal()">Отмена</button><button class="btn" onclick="showTray()">Скрыть в трей</button><button class="btn primary" onclick="closeModal();${state.active?'disconnect(()=>toast(\'Приложение завершило бы работу. Прототип остаётся открытым.\'))':'toast(\'Приложение завершило бы работу. Прототип остаётся открытым.\')'}">${state.active?'Отключить и выйти':'Выйти'}</button>`,true);}
function toggleSize(){const app=$('app');app.style.height=app.style.height==='840px'?'736px':'840px';}
function showGallery(){modal('Все экраны и состояния','<p>Выберите экран. Данные прототипа будут возвращены к демонстрационным значениям.</p><div class="gallery">'+scenarios.map(([v,t],i)=>`<button class="btn" onclick="scenario('${v}')"><span class="token">${String(i+1).padStart(2,'0')}</span>${esc(t)}</button>`).join('')+'</div>',`<button class="btn" onclick="closeModal()">Закрыть</button>`,true);}
function resetDemo(){authDialogOpen=false;++generation;state.profiles=demoProfiles();state.selected='moscow';state.active='moscow';state.runtime=clone(demoProfiles()[0]);state.target=null;state.phase='CONNECTED';state.error='';state.page='connections';state.draft=null;state.dirty=false;state.logProfile='all';state.logLevel='all';state.logQuery='';state.journalTab='events';state.settingsTab='general';state.events=initEvents();state.diagDone=false;state.engineAvailable=true;closeModal();}
function scenario(name){resetDemo();$('scenario').value=name;switch(name){case'disconnected':state.active=null;state.phase='DISCONNECTED';break;case'connecting':state.active=null;state.target='moscow';state.phase='CONNECTING';break;case'switch':state.selected='test';break;case'disconnecting':state.target='moscow';state.phase='DISCONNECTING';break;case'error':state.active=null;state.target='moscow';state.phase='ERROR';state.error='timeout';addEvent('Сервер не ответил вовремя','error','moscow','TIMEOUT\nПодключение не завершено. Повторите попытку или проверьте адрес сервера.');break;case'empty':state.profiles=[];state.active=null;state.selected=null;state.phase='DISCONNECTED';break;case'cleanup':state.active=null;state.target='moscow';state.phase='ERROR';state.error='cleanup';break;case'unsupported':state.active=null;state.phase='DISCONNECTED';state.engineAvailable=false;break;case'journal':state.page='journal';break;case'diagnostics':state.page='journal';state.journalTab='check';break;case'settings':state.page='settings';break;case'components':state.page='settings';state.settingsTab='components';break;}render();if(name==='add')showAdd();else if(name==='import')showImportPreview(clone(demoProfiles()[1]),['redirect-gateway не будет применён: весь интернет остаётся по настройкам системы.']);else if(['editor','access','networks','dns','dns-warning'].includes(name)){editProfile('moscow',name==='editor'?'main':name==='dns-warning'?'dns':name);if(name==='dns-warning'){state.draft.dns='10.80.0.53';state.dirty=true;renderEditor();}}else if(name==='active-save'){editProfile('moscow','networks');state.draft.networks.push('10.60.0.0/16');state.dirty=true;renderEditor();saveDraft();}else if(name==='auth'){state.active=null;state.target='moscow';state.phase='CONNECTING';render();showAuth();}else if(name==='permission'){state.active=null;state.phase='DISCONNECTED';render();showPermission();}else if(name==='tray')showTray();else if(name==='exit')showExit();else if(name==='delete')showDelete();else if(name==='export')showExport();else if(name==='vless-main')editProfile('personal','main');else if(name==='vless-access')editProfile('personal','access');else if(name==='add-file')showFileImport();else if(name==='add-link')showLinkImport();else if(name==='import-error')importError('Не поддерживается параметр plugin. Импорт остановлен: он не будет молча проигнорирован.');else if(name==='network-form'){editProfile('moscow','networks');showNetwork();}else if(name==='domain-form'){editProfile('moscow','dns');showDomain();}else if(name==='validation'){editProfile('moscow');validateDraft();}else if(name==='unsaved'){editProfile('moscow');state.draft.name='Новое название';state.dirty=true;renderEditor();navigate('connections');}else if(name==='log-detail'){state.page='journal';render();showEvent(4);}else if(name==='diagnostics-done'){state.page='journal';state.journalTab='check';state.diagDone=true;render();}else if(name==='profile-menu')toggleMenu({stopPropagation:()=>{}});else if(name==='report'){openDiagnostics();showReport();}else if(name==='about')showAbout();}
document.addEventListener('keydown',e=>{const overlay=$('overlay');if(e.key==='Escape'&&overlay.innerHTML){e.preventDefault();closeModal();return;}if(e.key==='Tab'&&overlay.innerHTML){const focusable=[...overlay.querySelectorAll('button:not([disabled]),input:not([disabled]),select:not([disabled]),textarea:not([disabled]),[tabindex="0"]')].filter(el=>el.getClientRects().length);if(focusable.length){const first=focusable[0],last=focusable.at(-1);if(e.shiftKey&&document.activeElement===first){e.preventDefault();last.focus();}else if(!e.shiftKey&&document.activeElement===last){e.preventDefault();first.focus();}}}if((e.ctrlKey||e.metaKey)&&e.key.toLowerCase()==='s'&&state.page==='editor'){e.preventDefault();saveDraft();}});
window.addEventListener('beforeunload',e=>{if(state.dirty){e.preventDefault();e.returnValue='';}});
render();
</script>
</body></html>
